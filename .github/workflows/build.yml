name: Build CamPro QMod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QPM
        uses: Fernthedev/qpm-action@main
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: true
          cache: true

      - name: Build module
        run: qpm build --release

      - name: Package QMod
        run: |
          mkdir -p release
          if [ -f libcampro.so ]; then cp libcampro.so release/; fi
          if [ -f campro.so ]; then cp campro.so release/; fi
          cd release
          zip -j campro.qmod *.so ../mod.json

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: campro-qmod
          path: release/campro.qmod
