name: Build on Ubuntu Manually

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install QPM Rust Manually
      run: |
        wget https://github.com/fernthedev/qpm-rust/releases/latest/download/qpm-rust-linux
        chmod +x qpm-rust-linux
        sudo mv qpm-rust-linux /usr/local/bin/qpm

    - name: Restore dependencies
      run: qpm restore

    - name: Build module
      run: qpm build

    - name: Package QMod
      run: qpm qmod package

    - name: Upload QMod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CamPro-QMod
        path: ./*.qmod
