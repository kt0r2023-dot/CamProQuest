name: Build CamPro QMod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install QPM
        uses: sc2ad/action-qpm@v1
        with:
          args: --version

      - name: Restore dependencies
        run: qpm restore

      - name: Build module
        run: qpm build --release

      - name: Package QMod
        run: |
          mkdir -p release
          cp libcampro.so release/ || true
          cp campro.so release/ || true
          zip -j release/campro.qmod release/*.so mod.json

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: campro-qmod
          path: release/campro.qmod
